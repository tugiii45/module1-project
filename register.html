<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - LostLeaf App</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body>
   
    <section class="page header">
        <h1>Register</h1>
        <p>Create a new account</p>
        <a href="index.html" class="btn" style="margin-top: 15px; display: inline-block;">
            <i class="fas fa-arrow-left"></i> Back to Home
        </a>
    </section>

    <section class="form-section">
        <form id="registerForm">
            <label for="regUsername">Username</label>
            <input type="text" id="regUsername" required>

            <label for="regPassword">Password</label>
            <input type="password" id="regPassword" required>

            <button type="submit">Register</button>
        </form>
        <p>Already have an account? <a href="login.html">Login here</a></p>
           
    </section>

    <footer>
        <p>Copyright 2026 LostLeaf Book Tracker | All Rights Reserved</p>
        <a href="https://www.instagram.com/?hl=en" target="_blank" rel="noopener noreferrer">
            <i class="fa-brands fa-instagram"></i>
        </a>
    </footer>
    <script src="script.js"></script>
    <script src="register.js"></script>

</body>
</html>
