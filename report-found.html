<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <title>Report Found Book</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body>
    <nav class="navbar">

          <h1>LostLeaf App</h1>
        

        <ul class="nav-links">
            <li><a href="index.html">Home</a></li>
            <li><a href="report-lost.html">Report Lost Book</a></li>
            <li><a href="report-found.html">Report Found Book</a></li>
            <li><a href="contact.html">Contact Us</a></li>
             <li><a href="listings.html">View Listings</a></li>
            <li id="auth-link"></li>
        </ul>
    </nav>

    <section class="page header">
        <h1>Report Found Book</h1>
        <p>Help someone recover their lost book by providing details about the found item</p>
    </section>

    <section class="form-section">
<form action="#" method="post" class="report-form" data-form-type="found">
            <label for="finder-name">Your Name:</label>
            <input type="text" id="finder-name" name="finder-name" required>

             <label for="book-title">Book Title</label>
            <input type="text" id="book-title" name="book-title" required>

            
<label for="bookCode">Book Code:</label>
            <input type="text" id="bookCode" name="bookCode" required>
            
            <label for="location-found">Where was the book found?</label>
            <input type="text" id="location-found" name="location-found" required>
            
<label for="dateFound">Date Found:</label>
            <input type="date" id="dateFound" name="dateFound" required>
            
            <label for="Description">Description:</label>
            <textarea id="description" name="description" rows="4" placeholder="color, condition, special marks..." required></textarea>
            
<label for="contact">Your Contact Information:</label>
            <input type="text" id="contact" name="contact" required>

<button type="submit">Submit Found Book Report</button>

        </form>
    </section>

    <footer>
        <p>Copyright 2026 LostLeaf Book Tracker | All Rights Reserved</p>
        <a href="https://www.instagram.com/?hl=en" target="_blank" rel="noopener noreferrer">
                <i class="fa-brands fa-instagram"></i>
        </a>
    </footer>
    <script src="showMessage.js"></script>
    <script src="script.js"></script>
    <script src="report-found.js"></script>





</body>
</html>
