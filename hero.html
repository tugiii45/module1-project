<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hero section</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&icon_names=menu"
    />
    <style>
      .material-symbols-outlined {
        font-variation-settings:
          "FILL" 0,
          "wght" 400,
          "GRAD" 0,
          "opsz" 24;
      }
    </style>
</head>
<body>
    <header>
        <div class="relative h-[50vh] md:h-screen w-full overflow-hidden">
            <video autoplay muted loop class="absolute top-0 left-0 w-full h-screen object-cover">
                <source src="/video/world.mp4" type="video/mp4">
            </video>
            <!-- overlay div -->
            <div class="absolute inset-0 bg-black/50"></div>
                <nav class="relative z-10 flex justify-between item-center text-white p-6 md:p-8 bg-gray-600/30">
                    <h1 class="font-bold text-2xl">Logo</h1>
                    <div class="hidden md:flex gap-6">
                        <a href="/">Home</a>
                        <a href="about.html">About</a>
                        <a href="contact.html">Contact</a>
                    </div>
                    <div class="md:hidden">
                        <span class="material-symbols-outlined"> menu </span>
                    </div>
                </nav>
                <!-- welcome message -->
                <div class="relative z-10 flex flex-col justify-center items-center text-white text-center h-md md:h-full p-2">
                    <h1 class="text-3xl md:text-5xl font-black mb-4">Welcome to tailwind styling</h1>
                    <p class="text-sm md:text-xl mb-2 ">Build modern design with tailwind today!</p>
                    <button class="bg-blue-900 p-2  hover:bg-white hover:text-black rounded-md">Get started</button>
                </div>
        </div>
    </header>
</body>
</html>
